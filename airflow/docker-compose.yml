services:

  postgres:
    image: postgres:16
    container_name: airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5


  airflow-init:
    image: apache/airflow:3.1.0
    container_name: airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      PYTHONPATH: /opt/airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ../pipeline:/opt/airflow/pipeline
      - ../utils:/opt/airflow/utils
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config

    command:
      - bash
      - -c
      - |
        airflow db migrate


  airflow-api-server:
    image: apache/airflow:3.1.0
    container_name: airflow-api-server

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      PYTHONPATH: /opt/airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ../pipeline:/opt/airflow/pipeline
      - ../utils:/opt/airflow/utils
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config

    ports:
      - "8080:8080"

    command: api-server


  airflow-scheduler:
    image: apache/airflow:3.1.0
    container_name: airflow-scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - ../.env

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080
      PYTHONPATH: /opt/airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ../pipeline:/opt/airflow/pipeline
      - ../utils:/opt/airflow/utils
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config

    command: scheduler


  airflow-dag-processor:
    image: apache/airflow:3.1.0
    container_name: airflow-dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - ../.env

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ../pipeline:/opt/airflow/pipeline
      - ../utils:/opt/airflow/utils
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config

    command: dag-processor


  api:
    container_name: fake-api

    build: ..

    command: uvicorn fast_api_app.app:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    volumes:
      - ../data:/app/data


volumes:
  postgres_data: